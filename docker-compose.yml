services:
    app:
        build:
            context: .
            dockerfile: docker/Dockerfile
        container_name: my_gaming_app
        volumes:
            - .:/var/www
        depends_on:
            - db
        networks:
            - gaming_network

    web:
        image: nginx:alpine
        container_name: my_gaming_web
        ports:
            - "8080:80"
        volumes:
            - .:/var/www
            - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf
        depends_on:
            - app
        networks:
            - gaming_network

    db:
        image: postgres:15-alpine
        container_name: my_gaming_db
        restart: unless-stopped
        environment:
            POSTGRES_DB: my_gaming_tracker
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: secret_pass
        ports:
            - "5432:5432"
        volumes:
            - pgdata:/var/lib/postgresql/data
        networks:
            - gaming_network

volumes:
    pgdata:

networks:
    gaming_network:
        driver: bridge
